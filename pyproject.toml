[project]
name = "columnmap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "seaborn>=0.13.2",
    "tokenizers==0.23.2",
]

[project.scripts]
columnmap = "columnmap.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
