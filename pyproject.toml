[project]
name = "columnmap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []  # the library uses the standard library only

[project.scripts]
columnmap = "columnmap.bench.cli:main"

[project.optional-dependencies]
graph = [
    "langgraph>=1.0,<2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepeval==4.3.1",
    "langgraph>=1.0,<2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
