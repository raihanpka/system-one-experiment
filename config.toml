# Defaults for the experiment; options given to the command override them.
[model]
# Passed to the llama.cpp based Jev scorer. Defaults are the documented fast and parity-tested setting.
quant = "Q8_0"          # F16 (reference), Q8_0 (recommended), Q4_K_M (smaller and faster, noisier)
ngl = 999               # layers on the GPU (Metal); 0 = CPU only
flash_attn = "default"  # default | auto | on | off
# threads = 8           # CPU threads of the scorer process (optional)

# lift rule for choosing input columns; uncomment to use it instead of keep_d (values set in E2 on dev)
# [honest]
# lift_top = 2.0
# lift_second = 2.0

[backend]
type = "local_gguf"    # the only backend for now; the scorer is the Jev GGUF runtime in vendor/

[device]
mode = "auto"           # auto (Metal on Apple Silicon, else CPU) | metal | cpu

[run]
keep_d = 0.0             # a column is chosen for a field when its score is at least this (0.0 is probability 0.5)
target_precision = 1.0    # fields are filled automatically only above the cutoff that reaches this precision (100 percent)
prompt_version = "v1"   # part of the calibration key: change it whenever a prompt changes
mode = "options"   # options: one question per input column (fast); pairs: one yes/no per (column, field), calibrated
seed = 1234
out_dir = "results"
conds = ["name", "samples"]   # desc and both (column descriptions) exist in code but are not given to the model: the real template has headers only
levels = [0, 1, 2, 3, 4, 5, 6]
n_per_level = 3   # 21 cases; ~0.1 s per question, ~90 s per case per condition on M3 (Q8_0)

[splits]
# seeds that build the data; only the baseline seed (run.seed) is written to data/, the others are rebuilt from the seed
dev = [11]               # tune prompts and contexts here
calibration = [12, 13]   # fit calibration parameters and thresholds here
test = [21, 22]          # look at this once, at the end (needs --final)
